[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bitculator"
dynamic = ["version"]
description = "Official Python SDK for the Bitculator Data API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bitculator" }]
keywords = ["bitculator", "crypto", "cryptocurrency", "market-data", "api", "sdk"]
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://bitculator.com/en/documentation/api/v1"
Repository = "https://github.com/bitculator/bitculator-python-sdk"

[tool.hatch.version]
path = "src/bitculator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bitculator"]
